[package]
name = "focusstage-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "focusstaged"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "use_system_lib",
    "renderer_pixman",
    "xwayland",
    "x11rb_event_source",
] }
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
wayland-server = "0.31"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xfixes"] }
xkbcommon = { version = "0.8", features = ["wayland"] }
drm-fourcc = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
